# Production-only scrape: API and Prometheus on the internal Compose bridge.
# Never proxy /actuator/prometheus from public Nginx; mount the secret as 0600.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: cloudchunk-api
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ["api:8080"]
        labels:
          application: cloudchunk
          role: api
