groups:
  - name: cloudchunk-production
    interval: 30s
    rules:
      - alert: CloudChunkApiScrapeDown
        expr: up{job="cloudchunk-api"} == 0
        for: 2m
        labels: {severity: critical, service: api}
        annotations:
          summary: "CloudChunk API metrics unavailable"
          runbook: "docs/27-production-stability.md"
      - alert: CloudChunkApiHigh5xx
        expr: |
          (sum(rate(http_server_requests_seconds_count{job="cloudchunk-api",status=~"5.."}[5m]))
          / clamp_min(sum(rate(http_server_requests_seconds_count{job="cloudchunk-api"}[5m])), 0.001)) > 0.05
          and sum(rate(http_server_requests_seconds_count{job="cloudchunk-api"}[5m])) > 0.1
        for: 5m
        labels: {severity: critical, service: api}
        annotations: {summary: "5xx rate above 5% under load"}
      - alert: CloudChunkApiP99LatencyHigh
        expr: |
          histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{job="cloudchunk-api"}[5m])) by (le)) > 2
          and sum(rate(http_server_requests_seconds_count{job="cloudchunk-api"}[5m])) > 0.1
        for: 10m
        labels: {severity: warning, service: api}
        annotations: {summary: "API P99 latency > 2s"}
      - alert: CloudChunkOutboxPublishFailures
        expr: increase(cloudchunk_outbox_publish_failures_total{job="cloudchunk-api"}[10m]) > 5
        for: 2m
        labels: {severity: warning, service: event-publisher}
        annotations: {summary: "Repeated Outbox publish failures"}
      - alert: CloudChunkHikariConnectionsExhausted
        expr: hikaricp_connections_pending{job="cloudchunk-api"} > 0
        for: 5m
        labels: {severity: warning, service: mysql}
        annotations: {summary: "Database connection pool has sustained waiters"}
