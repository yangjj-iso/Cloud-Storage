# LOCAL DEV ONLY: This receiver intentionally sends no notifications.
# Production must supply a private, approved file with real routing/receivers.
global:
  resolve_timeout: 5m
route:
  receiver: unconfigured
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: unconfigured
