name: cloudchunk

networks:
  cloudchunk-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  minio-data:
  qdrant-data:
  rmq-store:
  prometheus-data:
  grafana-data:
  alertmanager-data:

services:
  mysql:
    image: mysql:8.0
    container_name: cc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: cloudchunk
      TZ: Asia/Shanghai
    command:
      - "--default-authentication-plugin=mysql_native_password"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3308:3306"
    networks: [cloudchunk-net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 宿主机 6379 可能被别的 Redis 占用；此处暴露到 6380。
  redis:
    image: redis:7-alpine
    container_name: cc-redis
    restart: unless-stopped
    command: ["redis-server", "/etc/redis/redis.conf"]
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
    ports:
      - "6380:6379"
    networks: [cloudchunk-net]

  rmq-namesrv:
    image: apache/rocketmq:5.2.0
    container_name: cc-rmq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
    networks: [cloudchunk-net]

  rmq-broker:
    image: apache/rocketmq:5.2.0
    container_name: cc-rmq-broker
    restart: unless-stopped
    depends_on:
      - rmq-namesrv
    # 命名 volume 默认属主是 root，而镜像运行用户 rocketmq(3000) 无写权限。
    # 以 root 启动并在入口前 chown，再手动 drop 到 rocketmq。
    user: "0:0"
    entrypoint: ["sh","-c"]
    command:
      - |
        mkdir -p /home/rocketmq/store &&
        chown -R 3000:3000 /home/rocketmq/store &&
        su -s /bin/sh rocketmq -c "sh mqbroker -n cc-rmq-namesrv:9876 -c /home/rocketmq/rocketmq-5.2.0/conf/broker.conf"
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/rocketmq-5.2.0/conf/broker.conf:ro
      - rmq-store:/home/rocketmq/store
    environment:
      JAVA_OPT_EXT: "-Xms1g -Xmx1g -Xmn512m"
    ports:
      - "10909:10909"
      - "10911:10911"
    networks: [cloudchunk-net]

  rmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: cc-rmq-dashboard
    restart: unless-stopped
    depends_on:
      - rmq-namesrv
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=cc-rmq-namesrv:9876 -Dserver.port=8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8180:8080"
    networks: [cloudchunk-net]

  minio:
    image: minio/minio:latest
    container_name: cc-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9002:9000"
      - "9003:9001"
    networks: [cloudchunk-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional vector service; REST is bound to loopback, not the public interface.
  qdrant:
    profiles: ["vector"]
    image: qdrant/qdrant:v1.15.0
    container_name: cc-qdrant
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    networks: [cloudchunk-net]

  # minio-init removed: MinioStorageStrategy auto-creates the bucket on startup.

  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    image: cloudchunk-backend:local
    container_name: cc-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rmq-broker:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: api
      WORKER_ENABLED: "false"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RMQ_NAMESRV: cc-rmq-namesrv:9876
      MINIO_ENDPOINT: http://minio:9000
      MINIO_AK: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SK: ${MINIO_ROOT_PASSWORD:-minioadmin}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-http://localhost:8088}
      TRACING_SAMPLING: ${TRACING_SAMPLING:-0.0}
      OTLP_TRACES_ENDPOINT: ${OTLP_TRACES_ENDPOINT:-http://jaeger:4318/v1/traces}
      PROMETHEUS_PUBLIC: ${PROMETHEUS_PUBLIC:-false}
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
      AI_QDRANT_ENABLED: ${AI_QDRANT_ENABLED:-false}
      AI_QDRANT_URL: ${AI_QDRANT_URL:-http://qdrant:6333}
      AI_QDRANT_ALLOW_HTTP: ${AI_QDRANT_ALLOW_HTTP:-false}
      AI_QDRANT_API_KEY: ${AI_QDRANT_API_KEY:-}
      AI_QDRANT_COLLECTION_PREFIX: ${AI_QDRANT_COLLECTION_PREFIX:-cloudchunk_ai}
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [cloudchunk-net]

  worker:
    profiles: ["app"]
    image: cloudchunk-backend:local
    container_name: cc-worker
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rmq-broker:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: worker
      WORKER_ENABLED: "true"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RMQ_NAMESRV: cc-rmq-namesrv:9876
      MINIO_ENDPOINT: http://minio:9000
      MINIO_AK: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SK: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AI_QDRANT_ENABLED: ${AI_QDRANT_ENABLED:-false}
      AI_QDRANT_URL: ${AI_QDRANT_URL:-http://qdrant:6333}
      AI_QDRANT_ALLOW_HTTP: ${AI_QDRANT_ALLOW_HTTP:-false}
      AI_QDRANT_API_KEY: ${AI_QDRANT_API_KEY:-}
      AI_QDRANT_COLLECTION_PREFIX: ${AI_QDRANT_COLLECTION_PREFIX:-cloudchunk_ai}
      TRACING_SAMPLING: ${TRACING_SAMPLING:-0.0}
      OTLP_TRACES_ENDPOINT: ${OTLP_TRACES_ENDPOINT:-http://jaeger:4318/v1/traces}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [cloudchunk-net]

  web:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: cloudchunk-web:local
    container_name: cc-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "8088:80"
    networks: [cloudchunk-net]

  jaeger:
    profiles: ["observability"]
    image: jaegertracing/all-in-one:1.65.0
    container_name: cc-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "4317:4317"
      - "4318:4318"
      - "16686:16686"
    networks: [cloudchunk-net]

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1
    container_name: cc-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    networks: [cloudchunk-net]

  # Local default is deliberately a no-op receiver. Real notifications require
  # an operator-supplied private production config and delivery confirmation.
  alertmanager:
    profiles: ["observability"]
    image: prom/alertmanager:v0.27.0
    container_name: cc-alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./observability/alertmanager.dev.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks: [cloudchunk-net]

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.3.0
    container_name: cc-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - jaeger
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks: [cloudchunk-net]
