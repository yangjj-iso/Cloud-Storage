brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
namesrvAddr = cc-rmq-namesrv:9876
# Advertise the host gateway so both host-side development clients and app-profile
# containers can reach the broker through the published 10911 port.
brokerIP1 = host.docker.internal
listenPort = 10911
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
traceTopicEnable = true
